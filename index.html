<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#310807" />
    <title>Котик в аду: бургеры</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <section class="game-card" aria-label="Игра Котик в аду">
        <div class="topbar">
          <div>
            <p class="eyebrow">адская мини-игра</p>
            <h1>Котик в аду</h1>
          </div>
          <button class="sound-button" id="soundButton" type="button" aria-pressed="true" title="Включить или выключить звук">звук: да</button>
        </div>

        <div class="stats" aria-live="polite">
          <div class="stat"><span>бургеров</span><strong id="score">0</strong></div>
          <div class="stat"><span>мой рекорд</span><strong id="bestScore">0</strong></div>
          <div class="stat"><span>до спасения</span><strong id="time">45</strong></div>
        </div>

        <div class="game-area" id="gameArea" tabindex="0" aria-label="Игровое поле. Управляйте стрелками или клавишами A и D.">
          <div class="sky-glow glow-one"></div>
          <div class="sky-glow glow-two"></div>
          <div class="instructions" id="instructions">
            <span class="sparkle">☠</span>
            <p>Спаси котика от ада</p>
            <small>лови бургеры · не лови шипы</small>
          </div>
          <div class="player" id="player" aria-hidden="true"><img src="cat-player.png" alt="" /></div>
        </div>

        <div class="controls">
          <button class="move-button" id="leftButton" type="button" aria-label="Двигаться влево">←</button>
          <button class="start-button" id="startButton" type="button">в ад</button>
          <button class="move-button" id="rightButton" type="button" aria-label="Двигаться вправо">→</button>
        </div>
        <p class="hint">Обычный бургер: +1 · двойной: +3 · шип: −2</p>
        <p class="personal-note">даже в аду котик заслуживает бургер.</p>
      </section>
    </main>

    <div class="modal hidden" id="gameOverModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-content">
        <span class="modal-star">☠</span>
        <p class="eyebrow">КОНЕЦ ЗАБЕГА</p>
        <h2 id="modalTitle">Котик спас <span id="finalScore">0</span> бургеров!</h2>
        <p id="resultMessage">Котик выжил. А это уже неплохо.</p>
        <button class="start-button" id="playAgainButton" type="button">ещё раз</button>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
